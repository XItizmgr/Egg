<!DOCTYPE html>

<html>
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Someone left you something...</title>
</head>

<body
  style="
    margin: 0;
    padding: 0;
    background-color: #111111;
  "
>

  <!-- OUTER CONTAINER -->

  <table
    width="100%"
    cellpadding="0"
    cellspacing="0"
    border="0"
    style="
      margin: 0;
      padding: 0;
      background-color: #111111;
    "
  >

    <tr>

      <td
        align="center"
        style="
          padding: 30px 10px;
        "
      >

        <!-- LETTER -->

        <table
          width="640"
          cellpadding="0"
          cellspacing="0"
          border="0"
          style="
            width: 100%;
            max-width: 640px;

            background-color: #f7efd9;

            background-image:
              url('https://YOUR-DOMAIN.com/halloween-frame.jpg');

            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
          "
        >

          <tr>

            <td
              align="center"
              style="
                padding:
                  150px
                  85px
                  130px
                  85px;

                font-family:
                  Georgia,
                  'Times New Roman',
                  serif;

                color: #2b1b12;
              "
            >

              <!-- TITLE -->

              <p
                style="
                  margin: 0 0 12px 0;

                  font-family:
                    Georgia,
                    'Times New Roman',
                    serif;

                  font-size: 12px;

                  font-weight: bold;

                  letter-spacing: 4px;

                  text-transform: uppercase;

                  color: #68432c;
                "
              >
                A MESSAGE FOR YOU
              </p>


              <h1
                style="
                  margin: 0 0 45px 0;

                  font-family:
                    Impact,
                    'Arial Black',
                    Georgia,
                    serif;

                  font-size: 34px;

                  line-height: 1.2;

                  letter-spacing: 3px;

                  text-transform: uppercase;

                  color: #24150d;
                "
              >
                Someone Left<br>
                You Something
              </h1>


              <!-- SMALL INTRO -->

              <p
                style="
                  margin: 0 0 30px 0;

                  font-family:
                    Georgia,
                    'Times New Roman',
                    serif;

                  font-size: 16px;

                  line-height: 1.7;

                  font-style: italic;

                  color: #5a3d2a;
                "
              >
                You probably shouldn't have opened this.
              </p>


              <!-- USER MESSAGE -->

              <table
                width="100%"
                cellpadding="0"
                cellspacing="0"
                border="0"
              >

                <tr>

                  <td
                    style="
                      padding: 25px 20px;

                      border-top:
                        1px solid #8c7059;

                      border-bottom:
                        1px solid #8c7059;

                      font-family:
                        Georgia,
                        'Times New Roman',
                        serif;

                      font-size: 18px;

                      line-height: 1.8;

                      color: #291a11;

                      text-align: center;

                      white-space: pre-wrap;
                    "
                  >
                    ${safeMessage}
                  </td>

                </tr>

              </table>


              <!-- SPACE -->

              <div
                style="
                  height: 35px;
                  line-height: 35px;
                "
              >
                &nbsp;
              </div>


              <!-- EGG MESSAGE -->

              <p
                style="
                  margin: 0 0 8px 0;

                  font-family:
                    Georgia,
                    'Times New Roman',
                    serif;

                  font-size: 15px;

                  color: #60412e;
                "
              >
                But that's not all...
              </p>


              <p
                style="
                  margin: 0 0 20px 0;

                  font-family:
                    Georgia,
                    'Times New Roman',
                    serif;

                  font-size: 21px;

                  font-weight: bold;

                  color: #2d1b11;
                "
              >
                Something is waiting for you.
              </p>


              <!-- CLICKABLE EGG -->

              <a
                href="https://YOUR-DOMAIN.com"
                target="_blank"
                style="
                  text-decoration: none;
                "
              >

                <img
                  src="https://YOUR-DOMAIN.com/egg.png"
                  width="150"
                  alt="A mysterious egg"
                  style="
                    display: block;

                    width: 150px;
                    max-width: 150px;

                    height: auto;

                    margin: 0 auto 20px auto;

                    border: 0;
                  "
                >

              </a>


              <!-- BUTTON -->

              <a
                href="https://YOUR-DOMAIN.com"
                target="_blank"

                style="
                  display: inline-block;

                  padding:
                    14px
                    26px;

                  background-color: #25170f;

                  color: #f7efd9;

                  font-family:
                    Georgia,
                    'Times New Roman',
                    serif;

                  font-size: 13px;

                  font-weight: bold;

                  letter-spacing: 2px;

                  text-decoration: none;

                  text-transform: uppercase;
                "
              >
                Open The Egg
              </a>


              <!-- WARNING -->

              <p
                style="
                  margin:
                    45px
                    0
                    0
                    0;

                  font-family:
                    Georgia,
                    'Times New Roman',
                    serif;

                  font-size: 11px;

                  letter-spacing: 3px;

                  color: #735943;

                  text-transform: uppercase;
                "
              >
                Don't look away.
              </p>


              <!-- FOOTER -->

              <p
                style="
                  margin:
                    15px
                    0
                    0
                    0;

                  font-family:
                    Georgia,
                    'Times New Roman',
                    serif;

                  font-size: 10px;

                  color: #8b7461;
                "
              >
                This message was sent from somewhere you shouldn't know about.
              </p>

            </td>

          </tr>

        </table>

      </td>

    </tr>

  </table>

</body>
</html>
